<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ІНСОМНІЯ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="default">

  <!-- Intro -->
  <div class="intro-overlay" id="intro">
    <div class="intro-title">ІНСОМНІЯ</div>
    <div class="intro-nick" id="intro-nick"></div>
    <div class="intro-hint" id="intro-hint">ти вже тут</div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="logo">інсо<span>мнія</span></div>
    <div class="header-right">
      <div class="theme-switcher">
        <button class="theme-btn active" data-theme="default" title="Звичайна">●</button>
        <button class="theme-btn" data-theme="cosmos" title="Космос">✦</button>
        <button class="theme-btn" data-theme="negative" title="Негатив">✧</button>
      </div>
      <div class="dream-clock" id="dream-clock">--:--</div>
      <div class="user-nick">ти · <strong id="user-nick">...</strong></div>
    </div>
  </header>

  <!-- Feed -->
  <main class="feed" id="feed"></main>

  <!-- Панель коментарів -->
  <aside class="comments-panel" id="comments-panel">
    <div class="comments-header">
      <h3 id="comments-title">коментарі</h3>
      <button class="close-comments" id="close-comments">×</button>
    </div>
    <div class="comments-list" id="comments-list"></div>
  </aside>

  <!-- Форма створення -->
  <div class="compose">
    <textarea 
      id="compose-text" 
      placeholder="що тобі снилося..."
      maxlength="280"
    ></textarea>
    <div class="compose-actions">
      <button class="lucid-btn" id="lucid-btn" title="Люцидний режим">◈</button>
      <button class="publish-btn" id="publish-btn">опублікувати</button>
    </div>
  </div>

  <!-- Провал -->
  <div class="void" id="void">
    <span>ти прокинувся?</span>
  </div>

  <!-- Сонний параліч -->
  <div class="paralysis-msg" id="paralysis-msg">не рухайся</div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
